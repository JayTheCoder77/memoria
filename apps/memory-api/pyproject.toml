[project]
name = "memory-api"
version = "0.1.0"
description = "Core memory service for Memoria"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "testcontainers[postgres]>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
extend = "../../packages/config/ruff.toml"
src = ["src", "tests"]
