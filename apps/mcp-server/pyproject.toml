[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP adapter for the Memoria Memory API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend = "../../packages/config/ruff.toml"
src = ["src", "tests"]
