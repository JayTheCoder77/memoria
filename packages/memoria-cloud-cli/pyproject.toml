[project]
name = "memoria-cloud-cli"
version = "0.1.0"
description = "Command-line client for the Memoria Memory API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "memoria-cloud-sdk>=0.1.0",
    "rich>=13.9",
    "tomli-w>=1.1",
    "typer>=0.16",
]

[project.scripts]
memoria-cloud = "memoria_cloud_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoria_cloud_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend = "../config/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["memoria_cloud_cli"]

[tool.uv.sources]
memoria-cloud-sdk = { path = "../memoria-cloud-sdk", editable = true }
