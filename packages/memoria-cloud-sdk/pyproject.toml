[project]
name = "memoria-cloud-sdk"
version = "0.1.0"
description = "Python client for the Memoria Memory API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoria_cloud"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend = "../config/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["memoria_cloud"]
